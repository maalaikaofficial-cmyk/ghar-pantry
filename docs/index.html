<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#164d39"><title>Ghar Pantry — گھر پینٹری</title><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f3;color:#193329;font:15px system-ui,Arial,sans-serif}header{background:#164d39;color:white;padding:18px 16px 13px}h1{margin:0;font-size:25px}header p{margin:5px 0 0;opacity:.88}.wrap{max-width:940px;margin:auto}.grid{padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 9px #18372815}.photo{height:137px;background:#edf1eb;display:flex;align-items:center;justify-content:center}.photo img{height:100%;width:100%;object-fit:cover}.photo .fallback{font-size:13px;text-align:center;color:#6b776c;padding:8px}.details{padding:10px}.en{font-weight:700;min-height:38px;line-height:1.25}.ur{font:600 15px/2.1 'Noto Nastaliq Urdu',serif;min-height:37px;direction:rtl;text-align:left}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.actions button{border:1px solid #c9d3cc;background:#f7faf7;border-radius:9px;font-size:21px;padding:9px 0;cursor:pointer}.actions button[aria-pressed=true].yes{background:#c4edce;border-color:#32854c}.actions button[aria-pressed=true].low{background:#ffe4a1;border-color:#ba8723}.actions button[aria-pressed=true].no{background:#ffc9c5;border-color:#bb4c48}.tools{padding:14px 12px 4px;display:flex;gap:8px;flex-wrap:wrap}.tools input,.tools select{padding:11px;border:1px solid #cdd8ce;border-radius:9px;background:white;font-size:15px;flex:1;min-width:135px}.small{font-size:12px;color:#607067;padding:0 13px 16px}.count{padding:9px 13px;color:#54715d;font-weight:600}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.photo{height:170px}} </style></head><body><header><div class="wrap"><h1>Ghar Pantry · گھر پینٹری</h1><p>Tap ✓ Available, − Some left, or ✕ Finished</p></div></header><main class="wrap"><div id="count" class="count">65 grocery items</div><div id="grid" class="grid"></div><div class="tools"><input id="search" placeholder="Search items / چیز تلاش کریں" aria-label="Search items"><select id="category" aria-label="Filter category"><option value="">All categories</option></select></div><p class="small">Your selections are saved on this device. Photos need an internet connection.</p></main><script>
const items=[{"cat":"Vegetables","en":"Potato","ur":"آلو"},{"cat":"Vegetables","en":"Onion","ur":"پیاز"},{"cat":"Vegetables","en":"Tomato","ur":"ٹماٹر"},{"cat":"Vegetables","en":"Garlic","ur":"لہسن"},{"cat":"Vegetables","en":"Ginger","ur":"ادرک"},{"cat":"Vegetables","en":"Green Chilli","ur":"ہری مرچ"},{"cat":"Vegetables","en":"Coriander","ur":"ہرا دھنیا"},{"cat":"Vegetables","en":"Mint","ur":"پودینہ"},{"cat":"Vegetables","en":"Lemon","ur":"لیموں"},{"cat":"Vegetables","en":"Cucumber","ur":"کھیرا"},{"cat":"Vegetables","en":"Carrot","ur":"گاجر"},{"cat":"Vegetables","en":"Mushroom","ur":"مشروم"},{"cat":"Fruits","en":"Banana","ur":"کیلا"},{"cat":"Fruits","en":"Papaya","ur":"پپیتا"},{"cat":"Fruits","en":"Pomegranate","ur":"انار"},{"cat":"Fruits","en":"Peach","ur":"آڑو"},{"cat":"Fruits","en":"Kiwi","ur":"کیوی"},{"cat":"Fruits","en":"Avocado","ur":"ایووکاڈو"},{"cat":"Meat & Eggs","en":"Chicken Thighs","ur":"چکن ران"},{"cat":"Meat & Eggs","en":"Chicken Wings","ur":"چکن ونگز"},{"cat":"Meat & Eggs","en":"Chicken Leg Pieces","ur":"چکن لیگ پیس"},{"cat":"Meat & Eggs","en":"Beef Boneless","ur":"بغیر ہڈی گائے کا گوشت"},{"cat":"Meat & Eggs","en":"Beef Steak","ur":"بیف اسٹیک"},{"cat":"Meat & Eggs","en":"Beef With Bones","ur":"ہڈی والا گوشت"},{"cat":"Meat & Eggs","en":"Eggs","ur":"انڈے"},{"cat":"Dairy","en":"Dayfresh Milk","ur":"ڈے فریش دودھ"},{"cat":"Dairy","en":"Plain Yogurt","ur":"سادہ دہی"},{"cat":"Dairy","en":"Greek Yogurt","ur":"یونانی دہی"},{"cat":"Dairy","en":"Butter","ur":"مکھن"},{"cat":"Dairy","en":"Ghee","ur":"گھی"},{"cat":"Dairy","en":"Cooking Cream","ur":"کوکنگ کریم"},{"cat":"Dairy","en":"Cheddar Cheese","ur":"چیڈر چیز"},{"cat":"Dairy","en":"Mozzarella Cheese","ur":"موزریلا چیز"},{"cat":"Rice & Pantry Staples","en":"Basmati Rice","ur":"باسمتی چاول"},{"cat":"Rice & Pantry Staples","en":"Masoor Dal","ur":"مسور دال"},{"cat":"Rice & Pantry Staples","en":"Chana Dal","ur":"چنا دال"},{"cat":"Rice & Pantry Staples","en":"White Chickpeas","ur":"سفید چنے"},{"cat":"Rice & Pantry Staples","en":"Black Chickpeas","ur":"کالے چنے"},{"cat":"Rice & Pantry Staples","en":"White Beans","ur":"سفید لوبیا"},{"cat":"Rice & Pantry Staples","en":"Lobia","ur":"لوبیا"},{"cat":"Cleaning & Household","en":"Dishwashing Liquid","ur":"برتن دھونے کا لیکوڈ"},{"cat":"Cleaning & Household","en":"Dishwashing Sponge","ur":"برتن دھونے والا اسفنج"},{"cat":"Cleaning & Household","en":"Steel Scrubber","ur":"اسٹیل جالی"},{"cat":"Cleaning & Household","en":"Kitchen Cleaning Spray","ur":"کچن کلینر"},{"cat":"Cleaning & Household","en":"Floor Cleaner","ur":"فرش صاف کرنے والا"},{"cat":"Cleaning & Household","en":"Glass Cleaner","ur":"شیشہ صاف کرنے والا"},{"cat":"Cleaning & Household","en":"Bathroom Cleaner","ur":"باتھ روم کلینر"},{"cat":"Cleaning & Household","en":"Toilet Cleaner","ur":"ٹوائلٹ کلینر"},{"cat":"Cleaning & Household","en":"Disinfectant","ur":"جراثیم کش"},{"cat":"Cleaning & Household","en":"Air Freshener","ur":"ایئر فریشنر"},{"cat":"Cleaning & Household","en":"Laundry Detergent","ur":"کپڑے دھونے کا صابن"},{"cat":"Cleaning & Household","en":"Trash Bags","ur":"کچرے کے تھیلے"},{"cat":"Cleaning & Household","en":"Kitchen Tissue Rolls","ur":"کچن ٹشو رول"},{"cat":"Cleaning & Household","en":"Toilet Paper","ur":"ٹوائلٹ پیپر"},{"cat":"Cleaning & Household","en":"Paper Towels","ur":"پیپر ٹاول"},{"cat":"Cleaning & Household","en":"Aluminum Foil","ur":"ایلومینیم فوائل"},{"cat":"Cleaning & Household","en":"Cling Film","ur":"کلنگ فلم"},{"cat":"Cleaning & Household","en":"Ziplock Bags","ur":"زپ لاک بیگز"},{"cat":"Cleaning & Household","en":"Food Storage Bags","ur":"فوڈ اسٹوریج بیگز"},{"cat":"Cleaning & Household","en":"Disposable Gloves","ur":"دستانے"},{"cat":"Cleaning & Household","en":"Microfiber Cloths","ur":"مائیکرو فائبر کپڑا"},{"cat":"Cleaning & Household","en":"Cleaning Brushes","ur":"صفائی کے برش"},{"cat":"Cleaning & Household","en":"Hand Wash","ur":"ہینڈ واش"},{"cat":"Cleaning & Household","en":"Hand Sanitizer","ur":"ہینڈ سینیٹائزر"},{"cat":"Cleaning & Household","en":"Lighter","ur":"لائٹر"}];
const grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search'),category=document.getElementById('category');
const state=JSON.parse(localStorage.getItem('ghar-pantry-status-v2')||'{}');
const photos=JSON.parse(localStorage.getItem('ghar-pantry-photo-fixed-v3')||'{}');
const chosenStyle={"Potato":"white","Onion":"kitchen","Tomato":"kitchen","Garlic":"white","Ginger":"white","Green Chilli":"white","Coriander":"white","Mint":"kitchen","Lemon":"white","Cucumber":"kitchen"};
const kitchenSet=new Set(["Onion","Tomato","Mint","Cucumber","Papaya","Pomegranate","Peach","Avocado","Plain Yogurt","Greek Yogurt","Butter","Ghee","Cooking Cream","Cheddar Cheese","Mozzarella Cheese"]);
const photoQuery=(name)=>{const kitchen=(chosenStyle[name]||(kitchenSet.has(name)?"kitchen":"white"))==="kitchen";return name+" "+(kitchen?"in ceramic bowl on kitchen counter natural daylight food photograph":"isolated white background supermarket product photograph")};
const photoURL=(name)=>"https://tse2.mm.bing.net/th?q="+encodeURIComponent(photoQuery(name))+"&w=640&h=480&c=7&rs=1&p=0";

for(const cat of [...new Set(items.map(x=>x.cat))]){const o=document.createElement('option');o.value=cat;o.textContent=cat;category.append(o)}
const lookup={"Green Chilli":"chili pepper","Coriander":"coriander herb","Dayfresh Milk":"milk carton","Chicken Leg Pieces":"chicken drumstick","Beef With Bones":"beef meat","Lobia":"black eyed pea","Chana Dal":"split chickpea","Masoor Dal":"red lentil","White Chickpeas":"chickpea","Black Chickpeas":"black chickpea","White Beans":"white bean","Kitchen Tissue Rolls":"paper towel","Cooking Cream":"cream dairy"};
function render(){const q=search.value.trim().toLowerCase(),c=category.value;grid.replaceChildren();const shown=items.filter(x=>(!c||x.cat===c)&&(!q||x.en.toLowerCase().includes(q)||x.ur.includes(q)));count.textContent=shown.length+' grocery items';for(const item of shown){const card=document.createElement('article');card.className='card';const photo=document.createElement('div');photo.className='photo';const img=document.createElement('img');img.alt=item.en;img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>{img.remove();const t=document.createElement('span');t.className='fallback';t.textContent='Photo unavailable';photo.replaceChildren(t)};if(photos[item.en])img.src=photos[item.en];else{const t=document.createElement('span');t.className='fallback';t.textContent='Loading photo…';photo.append(t);loadPhoto(item.en)};if(photos[item.en])photo.append(img);const details=document.createElement('div');details.className='details';const en=document.createElement('div');en.className='en';en.textContent=item.en;const ur=document.createElement('div');ur.className='ur';ur.textContent=item.ur;const actions=document.createElement('div');actions.className='actions';[['yes','✓','Available'],['low','−','Some left'],['no','✕','Finished']].forEach(([key,symbol,label])=>{const b=document.createElement('button');b.className=key;b.textContent=symbol;b.title=label;b.setAttribute('aria-label',item.en+': '+label);b.setAttribute('aria-pressed',String(state[item.en]===key));b.onclick=()=>{state[item.en]=key;localStorage.setItem('ghar-pantry-status-v2',JSON.stringify(state));for(const btn of actions.children)btn.setAttribute('aria-pressed',String(btn===b))};actions.append(b)});details.append(en,ur,actions);card.append(photo,details);grid.append(card)}}
const pending=new Set();function loadPhoto(name){if(pending.has(name))return;pending.add(name);const src=photoURL(name);photos[name]=src;localStorage.setItem('ghar-pantry-photo-fixed-v3',JSON.stringify(photos));for(const card of document.querySelectorAll('.card'))if(card.querySelector('.en')?.textContent===name){const p=card.querySelector('.photo');const img=document.createElement('img');img.src=src;img.alt=name;img.loading='lazy';img.onerror=()=>{p.textContent='Photo unavailable'};p.replaceChildren(img)}pending.delete(name)}
search.oninput=render;category.onchange=render;render();
</script></body></html>
